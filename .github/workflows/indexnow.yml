name: IndexNow ping

# Tells Bing-family search engines (the index ChatGPT search leans on)
# about the URLs a push changed, after the production deploy is live. The
# key file is public by design: IndexNow verifies ownership by fetching it
# from the host.
#
# Only changed URLs are submitted. Resubmitting the whole sitemap on every
# push is what Bing Webmaster Tools flags as "batch mode", and it can delay
# indexing. Changed files map to URLs by the rules in the script below; a
# push that maps to nothing submits nothing.

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List files changed in this push
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then BEFORE="${{ github.sha }}~1"; fi
          git diff --name-only "$BEFORE" "${{ github.sha }}" > changed.txt
          cat changed.txt
      - name: Wait for Vercel deploy to go live
        run: sleep 150
      - name: Submit changed URLs to IndexNow
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request

          KEY = "98bf64ffb3c57bc315a5c8766dd7d597"
          BASE = "https://pitchboost.ai"
          with urllib.request.urlopen(f"{BASE}/sitemap.xml", timeout=30) as r:
              sitemap = re.findall(r"<loc>([^<]+)</loc>", r.read().decode())
          paths = [u[len(BASE):] or "/" for u in sitemap if u.startswith(BASE)]

          def under(prefix):
              return {p for p in paths if p == prefix or p.startswith(prefix + "/")}

          # Every language a section is published in (English at the root).
          LOC = ["", "/es", "/pt", "/fr", "/ar"]
          def each(*paths):
              return [l + p for l in LOC for p in paths]

          # Data files and shared components that feed whole sections. A
          # translation (lib/redesigns.fr.ts, lib/redesigns.ar.part1.ts) counts
          # as its section's file; see the stem below.
          SECTIONS = {
              "lib/redesigns": each("/redesign"),
              "lib/redesign-i18n": each("/redesign", "/ai-presentation-maker", "/presentations", "/help"),
              "components/marketing/redesign-page-view": each("/redesign"),
              "components/marketing/redesign-hub-view": each("/redesign"),
              "lib/presentations": each("/ai-presentation-maker", "/presentations"),
              "lib/presentations-i18n": each("/ai-presentation-maker", "/presentations"),
              "components/marketing/presentation-page-view": each("/presentations"),
              "components/marketing/presentation-hub-view": each("/ai-presentation-maker"),
              "lib/i18n": ["/ar/redesign", "/ar/ai-presentation-maker", "/ar/presentations", "/ar/help"],
              "lib/answers": ["/answers"],
              "lib/help": each("/help"),
              "lib/help-i18n": each("/help"),
              "components/marketing/help-views": each("/help"),
              "lib/research": ["/research"],
              "lib/competitors": ["/compare", "/alternatives"],
              "lib/industries": ["/industries"],
              "lib/features": ["/features"],
              "lib/cities": ["/real-estate"],
              "lib/net-sheet-states": ["/tools/seller-net-sheet"],
              "lib/guides": ["/redesign", "/answers"],
              "components/marketing/pricing-plans": ["/pricing"],
              "components/marketing/faq-data": [],
          }
          SINGLE = {
              "components/marketing/pricing-plans": ["/"],
              "components/marketing/faq-data": ["/"],
          }

          changed = [l.strip() for l in open("changed.txt") if l.strip()]
          out = set()
          for f in changed:
              m = re.match(r"content/blog/(.+)\.mdx$", f)
              if m:
                  out |= {f"/blog/{m.group(1)}", "/blog"}
                  continue
              stem = re.sub(r"\.tsx?$", "", f)
              stem = re.sub(r"\.(es|pt|fr|ar)(\.part\d+)?$", "", stem)
              for key, prefixes in SECTIONS.items():
                  if stem == key:
                      for p in prefixes:
                          out |= under(p)
              out |= set(SINGLE.get(stem, []))
              m = re.match(r"app/(.+?)/(?:\[[^/]+\]/)?(?:page|layout)\.tsx$", f)
              if m:
                  out |= under("/" + m.group(1).split("/[")[0])
              elif f == "app/page.tsx":
                  out.add("/")

          urls = sorted(BASE + p for p in out if p in paths or p == "/")
          print(f"{len(changed)} files changed, {len(urls)} urls to submit")
          for u in urls:
              print(" ", u)
          if not urls:
              raise SystemExit(0)
          body = json.dumps({
              "host": "pitchboost.ai",
              "key": KEY,
              "keyLocation": f"{BASE}/{KEY}.txt",
              "urlList": urls[:10000],
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print("indexnow status:", r.status)
          EOF
